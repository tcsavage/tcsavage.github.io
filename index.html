<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tom Savage</title>
    <meta name="description" content="Tom Savage, software engineer.">
    <style>
        :root { color-scheme: light dark; --fg: #222; --muted: #666; --bg: #fff; --link: #0b62c4; }
        @media (prefers-color-scheme: dark) {
            :root { --fg: #e6e6e6; --muted: #999; --bg: #141414; --link: #6aa9f0; }
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 0 16px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--fg);
            font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        h1 { margin: 0 0 .25em; font-size: 2rem; }
        p { margin: 0 0 1em; color: var(--muted); }
        a { color: var(--link); }
    </style>
</head>
<body>
    <main>
        <h1>Tom Savage</h1>
        <p>Software engineer.</p>
        <a href="https://github.com/tcsavage">GitHub</a>
    </main>
</body>
</html>
